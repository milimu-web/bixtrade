<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>BrixTrade LIVE Admin</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{background:#0a0a0f;color:#fff;min-height:100vh}
#lockScreen{position:fixed;inset:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lockBox{background:#16161f;border:1px solid #26263a;border-radius:16px;padding:28px;width:100%;max-width:360px;text-align:center}
.lockBox h2{margin-bottom:8px}.lockBox p{color:#8a8ab3;font-size:13px;margin-bottom:18px}
.lockBox input{width:100%;padding:14px;border-radius:10px;border:1px solid #333355;background:#0e0e18;color:#fff;font-size:15px;outline:none;margin-bottom:12px}
.lockBox button{width:100%;padding:14px;border-radius:10px;border:none;background:#8b8dff;color:#fff;font-weight:800;font-size:14px;cursor:pointer}
.lockBox .err{color:#ff5a5a;font-size:12px;margin-top:10px;display:none}
.header{background:#12121b;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #22223a;position:sticky;top:0;z-index:10;flex-wrap:wrap;gap:10px}
.tabs{display:flex;gap:8px;padding:12px 20px;background:#0f0f17;position:sticky;top:60px;z-index:9;border-bottom:1px solid #22223a}
.tab{padding:8px 16px;border-radius:20px;border:1px solid #2a2a44;background:#1a1a2a;color:#9a9ab8;cursor:pointer;font-weight:700;font-size:13px}
.tab.on{background:#8b8dff;color:#fff;border-color:#8b8dff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:20px}
.card{background:#16161f;border:1px solid #26263a;border-radius:12px;padding:14px}
.card small{color:#8a8ab3;font-size:11px;text-transform:uppercase}
.card h3{margin-top:6px;font-size:20px}
.card.fee h3{color:#00d084}.card.pending h3{color:#ffbd2e}
.main{padding:0 20px 40px}table{width:100%;border-collapse:collapse;background:#12121b;border-radius:12px;overflow:hidden}
th{background:#1a1a2a;text-align:left;padding:12px 10px;font-size:12px;color:#9a9ab8;text-transform:uppercase}
td{padding:12px 10px;border-top:1px solid #22223a;font-size:13px;vertical-align:top}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700}
.PENDING{background:#332a00;color:#ffbd2e}.APPROVED,.SUCCESS{background:#003d22;color:#00d084}.REJECTED{background:#3d0014;color:#ff5a5a}
.btn{padding:6px 10px;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px;margin-right:4px}
.approve{background:#00d084;color:#000}.reject{background:#ff5a5a;color:#fff}.view{background:#2a2a44;color:#fff}
@media(max-width:700px){.header{padding:10px 12px}.tabs{padding:10px 12px;top:52px}.stats{grid-template-columns:1fr 1fr;padding:12px;gap:8px}.main{padding:0 8px 20px}th,td{padding:8px 6px}.btn{padding:5px 8px;font-size:11px}}
#appContent{display:none}
#kycModal,#payModal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;justify-content:center;align-items:flex-start;overflow:auto;padding:20px}
#kycModal.show,#payModal.show{display:flex}
.kbox{background:#16161f;border:1px solid #26263a;border-radius:14px;padding:20px;width:100%;max-width:900px}
.kimgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0}
.kimgs figure{background:#0e0e18;border:1px solid #26263a;border-radius:10px;overflow:hidden}
.kimgs img{width:100%;display:block;cursor:zoom-in;max-height:360px;object-fit:contain;background:#000}
.kimgs img.zoom{position:fixed;inset:0;width:100vw;height:100vh;max-height:none;z-index:600;cursor:zoom-out}
.kimgs figcaption{padding:6px 10px;font-size:12px;color:#9a9ab8}
.kimgs .none{padding:40px 10px;text-align:center;color:#666;font-size:12px}
.pr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #22223a;font-size:14px}.pr small{color:#8a8ab3;display:block;font-size:11px;text-transform:uppercase}.pr b{font-size:16px}.cp{background:#2a2a44;color:#fff;border:none;border-radius:6px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:12px;margin-left:8px}.warn{margin:12px 0;padding:10px 12px;border-radius:10px;background:#332a00;color:#ffbd2e;font-size:12px;line-height:1.5}.pin{width:100%;padding:12px;border-radius:10px;border:1px solid #333355;background:#0e0e18;color:#fff;font-size:15px;margin:6px 0 12px;text-transform:uppercase}
.krow{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:#cfcfe6}.krow small{color:#8a8ab3;display:block;font-size:11px;text-transform:uppercase}
</style>
</head><body>
 
<div id="lockScreen">
  <div class="lockBox">
    <h2>🔒 BrixTrade Admin</h2>
    <p>Sign in with your admin account</p>
    <input id="emailInput" type="email" placeholder="Admin email" autocomplete="username">
    <input id="passInput" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button onclick="adminLogin()">Sign in</button>
    <div class="err" id="errMsg"></div>
  </div>
</div>
 
<div id="appContent">
<div class="header"><div><b>BrixTrade LIVE</b> <span style="color:#666;font-size:12px">/ brixtrade-c142d</span></div><div><span style="color:#00d084">● LIVE</span> <a href="notify.html" class="btn view" style="text-decoration:none;display:inline-block">🔔 Notify</a> <button onclick="location.reload()" class="btn view">Refresh</button> <button onclick="logoutAdmin()" class="btn view">Logout</button></div></div>
<div class="tabs"><button class="tab on" id="tabDep" onclick="switchType('deposits')">Deposits <span id="cDep">0</span></button><button class="tab" id="tabWit" onclick="switchType('withdrawals')">Withdrawals <span id="cWit">0</span></button><button class="tab" id="tabKyc" onclick="switchType('kyc')">Verification <span id="cKyc">0</span></button></div>
<div class="stats"><div class="card"><small>Total Users</small><h3 id="sUsers">0</h3></div><div class="card"><small id="lTotal">Total Requests</small><h3 id="sTotal">0</h3></div><div class="card pending"><small id="lPending">Pending Amount</small><h3 id="sPending">$0</h3></div><div class="card fee"><small id="lFee">Total Fees (3%)</small><h3 id="sFee">$0</h3></div><div class="card"><small id="lReceive">Net To Pay / Add</small><h3 id="sReceive">$0</h3></div></div>
<div class="main"><div style="overflow:auto"><table><thead id="thead"></thead><tbody id="tbody"><tr><td colspan="8" style="text-align:center;padding:30px">Connecting...</td></tr></tbody></table></div></div>
</div>
 
<script>
const firebaseConfig = { apiKey: "AIzaSyA7KMnx_MBfX3DQ5hQ6qzOg6jCbX7kZs-o", authDomain: "brixtrade-c142d.firebaseapp.com", projectId: "brixtrade-c142d", storageBucket: "brixtrade-c142d.firebasestorage.app", messagingSenderId: "489953142453", appId: "1:489953142453:web:2499588c325482d17a00fc", measurementId: "G-EX79EB9RDN" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
 
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tms = v => v && v.toMillis ? v.toMillis() : (typeof v === 'number' ? v : (Date.parse(v) || 0));
const fmtDate = v => { const t = tms(v); return t ? new Date(t).toLocaleString() : (v ? String(v) : ''); };
function showErr(m){ const e = document.getElementById('errMsg'); e.textContent = m; e.style.display = 'block'; }
 
let started = false;
 
function adminLogin(){
  const email = document.getElementById('emailInput').value.trim();
  const pass = document.getElementById('passInput').value;
  if(!email || !pass){ showErr('Enter your email and password'); return; }
  document.getElementById('errMsg').style.display = 'none';
  auth.signInWithEmailAndPassword(email, pass).catch(e => showErr(e.message));
}
 
function logoutAdmin(){ auth.signOut().then(() => location.reload()); }
 
// Only accounts that have a document in the "admins" collection (document id = their UID) get in.
auth.onAuthStateChanged(async user => {
  if(!user) return;
  try{
    const snap = await db.collection('admins').doc(user.uid).get();
    if(!snap.exists){
      showErr('This account is not an admin. UID: ' + user.uid);
      await auth.signOut();
      return;
    }
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';
    if(!started){ started = true; startApp(); }
  }catch(e){
    showErr('Could not verify admin access: ' + e.message);
  }
});
 
let curType = 'deposits';
let deposits = [], withdrawals = [], kycList = [];
 
function switchType(t){
  curType = t;
  document.getElementById('tabDep').classList.toggle('on', t === 'deposits');
  document.getElementById('tabWit').classList.toggle('on', t === 'withdrawals');
  document.getElementById('tabKyc').classList.toggle('on', t === 'kyc');
  render();
}
 
function startApp(){
  const fail = err => { document.getElementById('tbody').innerHTML = '<tr><td colspan="8" style="color:#ff5a5a">Error: ' + esc(err.message) + '</td></tr>'; };
 
  // No orderBy here: documents that lack the field would be silently left out. We sort in the browser instead.
  db.collection('deposits').onSnapshot(snap => {
    deposits = [];
    snap.forEach(doc => {
      const d = doc.data();
      if(String(d.status || '').toLowerCase() !== 'success') return; // only successful deposits
      deposits.push(Object.assign({ docId: doc.id }, d, {
        amount: Number(d.amount != null ? d.amount : d.usd) || 0,
        ref: d.ref || d.reference || '',
        sortKey: tms(d.createdAt || d.date || d.id)
      }));
    });
    deposits.sort((a, b) => b.sortKey - a.sortKey);
    document.getElementById('cDep').textContent = deposits.length;
    if(curType === 'deposits') render();
  }, fail);
 
  db.collection('kyc').onSnapshot(snap => {
    kycList = [];
    snap.forEach(doc => kycList.push(Object.assign({ docId: doc.id }, doc.data(), { sortKey: tms(doc.data().submittedAt) })));
    kycList.sort((a, b) => b.sortKey - a.sortKey);
    document.getElementById('cKyc').textContent = kycList.filter(r => String(r.status || '').toLowerCase() === 'pending').length;
    if(curType === 'kyc') render();
  }, fail);

  db.collection('users').onSnapshot(
    snap => { document.getElementById('sUsers').textContent = snap.size; },
    () => { document.getElementById('sUsers').textContent = '–'; }
  );

  db.collection('withdrawals').onSnapshot(snap => {
    withdrawals = [];
    snap.forEach(doc => {
      const d = doc.data();
      withdrawals.push(Object.assign({ docId: doc.id }, d, {
        amount: Number(d.amount) || 0,
        sortKey: Number(d.id) || tms(d.timestamp || d.date)
      }));
    });
    withdrawals.sort((a, b) => b.sortKey - a.sortKey);
    document.getElementById('cWit').textContent = withdrawals.length;
    if(curType === 'withdrawals') render();
  }, fail);
 
  document.getElementById('tbody').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if(b) updateStatus(b.dataset.id, b.dataset.s);
    const k = e.target.closest('button[data-kyc]');
    if(k) reviewKyc(k.dataset.kyc);
  });
}
 
function actions(r){
  return r.status === 'PENDING'
    ? '<button class="btn approve" data-id="' + esc(r.docId) + '" data-s="APPROVED">Approve</button><button class="btn reject" data-id="' + esc(r.docId) + '" data-s="REJECTED">Reject</button>'
    : '';
}
 
function setLabels(a){ ['lTotal','lPending','lFee','lReceive'].forEach((id, i) => document.getElementById(id).textContent = a[i]); }

function render(){
  if(curType === 'kyc'){ renderKyc(); return; }
  setLabels(['Total Requests','Pending Amount','Total Fees (3%)','Net To Pay / Add']);
  const list = curType === 'deposits' ? deposits : withdrawals;
  document.getElementById('thead').innerHTML = curType === 'deposits'
    ? '<tr><th>Date</th><th>User / Phone</th><th>Amount</th><th>Ref</th><th>KES</th><th>Status</th><th>Action</th></tr>'
    : '<tr><th>Date</th><th>User / Phone</th><th>Amount</th><th>Fee 3%</th><th>Receive / KES</th><th>KYC</th><th>Status</th><th>Action</th></tr>';
 
  let pendingAmt = 0, feeTot = 0, receiveTot = 0;
  list.forEach(r => {
    const fee = r.fee || r.amount * 0.03, rec = r.receive || r.amount - fee;
    if(r.status === 'PENDING') pendingAmt += r.amount;
    if(curType === 'withdrawals'){ feeTot += fee; receiveTot += rec; } else { receiveTot += r.amount; }
  });
  document.getElementById('sTotal').textContent = list.length;
  document.getElementById('sPending').textContent = '$' + pendingAmt.toFixed(2);
  document.getElementById('sFee').textContent = '$' + feeTot.toFixed(2);
  document.getElementById('sReceive').textContent = '$' + receiveTot.toFixed(2);
 
  if(!list.length){
    document.getElementById('tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:#666">' + (curType === 'deposits' ? 'No successful deposits yet' : 'No withdrawals yet') + '</td></tr>';
    return;
  }
 
  document.getElementById('tbody').innerHTML = list.map(r => {
    const st = String(r.status || '').toUpperCase();
    if(curType === 'deposits'){
      return '<tr><td>' + esc(fmtDate(r.createdAt || r.date)) + '</td><td><b>' + esc(r.name) + '</b><br>' + esc(r.phone) + '<br><small style="color:#666">' + esc(r.email) + '</small></td><td><b>$' + r.amount.toFixed(2) + '</b></td><td style="font-size:11px">' + esc(r.ref) + '</td><td>KES ' + esc(r.kes != null ? Number(r.kes).toLocaleString() : (r.amount * 130).toFixed(0)) + '</td><td><span class="badge ' + esc(st) + '">' + esc(r.status) + '</span></td><td>' + actions(r) + '</td></tr>';
    }
    const fee = r.fee || r.amount * 0.03, rec = r.receive || r.amount - fee;
    return '<tr><td>' + esc(fmtDate(r.date)) + '</td><td><b>' + esc(r.mpesaName) + '</b><br>' + esc(r.phone) + '</td><td><b>$' + r.amount.toFixed(2) + '</b></td><td style="color:#ffbd2e">$' + fee.toFixed(2) + '</td><td style="color:#00d084"><b>$' + rec.toFixed(2) + '</b><br><small>KES ' + (rec * 130).toFixed(0) + '</small></td><td>' + (r.idNum ? esc(r.idNum) : (r.kycVerified ? '✓ KYC' : '')) + '</td><td><span class="badge ' + esc(st) + '">' + esc(r.status) + '</span></td><td>' + actions(r) + '</td></tr>';
  }).join('');
}
 
function renderKyc(){
  document.getElementById('thead').innerHTML = '<tr><th>Submitted</th><th>Name / ID number</th><th>ID type</th><th>Status</th><th>Action</th></tr>';
  const c = { PENDING: 0, APPROVED: 0, REJECTED: 0 };
  kycList.forEach(r => { const st = String(r.status || '').toUpperCase(); if(c[st] != null) c[st]++; });
  setLabels(['Total Submissions','Pending Review','Approved','Rejected']);
  document.getElementById('sTotal').textContent = kycList.length;
  document.getElementById('sPending').textContent = c.PENDING;
  document.getElementById('sFee').textContent = c.APPROVED;
  document.getElementById('sReceive').textContent = c.REJECTED;
  if(!kycList.length){
    document.getElementById('tbody').innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:#666">No verification requests yet</td></tr>';
    return;
  }
  document.getElementById('tbody').innerHTML = kycList.map(r => {
    const st = String(r.status || '').toUpperCase();
    return '<tr><td>' + esc(fmtDate(r.submittedAt)) + '</td><td><b>' + esc(r.fullName) + '</b><br><span style="font-family:monospace">' + esc(r.idNumber) + '</span><br><small style="color:#666">' + esc(r.docId) + '</small></td><td>' + esc(r.idType) + '</td><td><span class="badge ' + esc(st) + '">' + esc(r.status) + '</span>' + (r.reason ? '<br><small style="color:#8a8ab3">' + esc(r.reason) + '</small>' : '') + '</td><td><button class="btn view" data-kyc="' + esc(r.docId) + '">Review</button></td></tr>';
  }).join('');
}

function kycModalEl(){
  let m = document.getElementById('kycModal');
  if(m) return m;
  m = document.createElement('div');
  m.id = 'kycModal';
  m.innerHTML = '<div class="kbox"></div>';
  document.body.appendChild(m);
  m.addEventListener('click', e => {
    if(e.target === m){ m.classList.remove('show'); return; }
    const img = e.target.closest('.kimgs img'); if(img){ img.classList.toggle('zoom'); return; }
    const b = e.target.closest('button[data-act]'); if(!b) return;
    if(b.dataset.act === 'close') m.classList.remove('show');
    else setKyc(b.dataset.id, b.dataset.act);
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') m.classList.remove('show'); });
  return m;
}

async function reviewKyc(id){
  const r = kycList.find(x => x.docId === id); if(!r) return;
  const m = kycModalEl(), box = m.querySelector('.kbox');
  m.classList.add('show');
  box.innerHTML = '<p style="color:#8a8ab3">Loading photos…</p>';
  const imgs = {};
  try{
    const s = await db.collection('kyc').doc(id).collection('images').get();
    s.forEach(d => { imgs[d.id] = d.data().data; });
  }catch(e){
    box.innerHTML = '<p style="color:#ff5a5a">Could not load photos: ' + esc(e.message) + '</p><button class="btn view" data-act="close">Close</button>';
    return;
  }
  const ok = v => typeof v === 'string' && /^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(v);
  const fig = (k, label) => '<figure>' + (ok(imgs[k]) ? '<img src="' + imgs[k] + '" alt="' + label + '">' : '<div class="none">No photo</div>') + '<figcaption>' + label + '</figcaption></figure>';
  const st = String(r.status || '').toUpperCase();
  box.innerHTML =
    '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="font-size:18px">Verification review</h2><span class="badge ' + esc(st) + '">' + esc(r.status) + '</span></div>' +
    '<div class="krow" style="margin-top:12px"><div><small>Full name</small><b>' + esc(r.fullName) + '</b></div><div><small>ID type</small>' + esc(r.idType) + '</div><div><small>ID number</small><b style="font-family:monospace">' + esc(r.idNumber) + '</b></div><div><small>Submitted</small>' + esc(fmtDate(r.submittedAt)) + '</div><div><small>User ID</small><span style="font-size:11px">' + esc(r.docId) + '</span></div></div>' +
    '<div class="krow" style="margin-top:12px">' + kf('Date of birth', r.dob) + kf('Nationality', r.nationality) + kf('Address', [r.address, r.town, r.county].filter(Boolean).join(', ')) + kf('Occupation', r.occupation) + kf('Source of funds', r.sourceOfFunds) + '</div>' +
    '<div class="kimgs">' + fig('front', 'ID front') + fig('back', 'ID back') + fig('selfie', 'Selfie') + '</div>' +
    '<p style="color:#8a8ab3;font-size:12px;margin-bottom:12px">Check that the name and number match the ID, the ID is real and readable, and the selfie is the same person. Click a photo to enlarge.</p>' +
    '<div>' + (st !== 'APPROVED' ? '<button class="btn approve" data-act="approved" data-id="' + esc(id) + '">Approve</button>' : '') + (st !== 'REJECTED' ? '<button class="btn reject" data-act="rejected" data-id="' + esc(id) + '">Reject</button>' : '') + '<button class="btn view" data-act="close">Close</button></div>';
}

async function setKyc(id, status){
  let reason = null;
  if(status === 'rejected'){
    reason = prompt('Reason shown to the user:', 'Photo is not clear. Please retake your ID and selfie.');
    if(reason === null) return;
  }else if(!confirm('Approve this verification? The user will be able to withdraw.')) return;
  try{
    await db.collection('kyc').doc(id).update({ status, reason: reason || null, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() });
    document.getElementById('kycModal').classList.remove('show');
  }catch(e){ alert('Could not update: ' + e.message); }
}

const kf = (l, v) => '<div><small>' + l + '</small>' + esc(v || '-') + '</div>';

function payModalEl(){
  let m = document.getElementById('payModal');
  if(m) return m;
  m = document.createElement('div');
  m.id = 'payModal';
  m.innerHTML = '<div class="kbox" style="max-width:460px"></div>';
  document.body.appendChild(m);
  m.addEventListener('click', e => {
    if(e.target === m){ m.classList.remove('show'); return; }
    const c = e.target.closest('button[data-copy]');
    if(c){
      const v = c.dataset.copy;
      (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).catch(() => { const t = document.createElement('textarea'); t.value = v; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }).finally(() => { c.textContent = 'Copied'; setTimeout(() => c.textContent = 'Copy', 1500); });
      return;
    }
    const b = e.target.closest('button[data-pay]'); if(!b) return;
    if(b.dataset.pay === 'close') m.classList.remove('show');
    else confirmPaid(b.dataset.id);
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') m.classList.remove('show'); });
  return m;
}

function openPayout(id){
  const r = withdrawals.find(x => x.docId === id); if(!r) return;
  const fee = r.fee != null ? Number(r.fee) : Math.round(r.amount * 3) / 100;
  const rec = r.receive != null ? Number(r.receive) : Math.round((r.amount - fee) * 100) / 100;
  const kes = r.receiveKes != null ? Number(r.receiveKes) : Math.round(rec * 130);
  const m = payModalEl();
  m.querySelector('.kbox').innerHTML =
    '<h2 style="font-size:18px;margin-bottom:4px">Send M-PESA payment</h2>' +
    '<div class="pr"><div><small>Name on M-PESA</small><b>' + esc(r.mpesaName) + '</b></div></div>' +
    '<div class="pr"><div><small>Phone</small><b style="font-family:monospace">' + esc(r.phone) + '</b></div><button class="cp" data-copy="' + esc(r.phone) + '">Copy</button></div>' +
    '<div class="pr"><div><small>Send this amount (KES)</small><b style="color:#00d084">' + kes.toLocaleString() + '</b></div><button class="cp" data-copy="' + kes + '">Copy</button></div>' +
    '<div class="pr"><div><small>Requested / fee 3% / user gets</small>$' + r.amount.toFixed(2) + ' / $' + fee.toFixed(2) + ' / $' + rec.toFixed(2) + '</div></div>' +
    '<div class="warn">Send the money first, then press Confirm. The user is told "Withdrawal successful" the moment you confirm.</div>' +
    '<label style="font-size:12px;color:#8a8ab3">M-PESA transaction code (optional, the user will see it)</label>' +
    '<input class="pin" id="payCode" maxlength="20" placeholder="e.g. SKL1ABC2DE" autocomplete="off">' +
    '<div><button class="btn approve" data-pay="ok" data-id="' + esc(id) + '" style="padding:10px 14px">Confirm money sent</button><button class="btn view" data-pay="close" style="padding:10px 14px">Cancel</button></div>';
  m.classList.add('show');
}

async function confirmPaid(id){
  const code = (document.getElementById('payCode').value || '').trim().toUpperCase();
  if(code && !/^[A-Z0-9]{6,20}$/.test(code)){ alert('The M-PESA code should be letters and numbers only.'); return; }
  const ref = db.collection('withdrawals').doc(id);
  try{
    await db.runTransaction(async tx => {
      const w = await tx.get(ref);
      if(!w.exists) throw new Error('Withdrawal not found');
      if(w.data().status !== 'PENDING') throw new Error('Already ' + w.data().status);
      tx.update(ref, { status: 'APPROVED', mpesaCode: code || null, paidAt: firebase.firestore.FieldValue.serverTimestamp() });
    });
    document.getElementById('payModal').classList.remove('show');
  }catch(e){ alert('Could not confirm: ' + e.message); }
}

async function rejectWithdrawal(id){
  const reason = prompt('Reason shown to the user (their money will be refunded):', 'Details could not be verified.');
  if(reason === null) return;
  const ref = db.collection('withdrawals').doc(id);
  try{
    await db.runTransaction(async tx => {
      const w = await tx.get(ref);
      if(!w.exists) throw new Error('Withdrawal not found');
      const d = w.data();
      if(d.status !== 'PENDING') throw new Error('Already ' + d.status);
      tx.update(ref, { status: 'REJECTED', reason: reason || null, reviewedAt: firebase.firestore.FieldValue.serverTimestamp() });
      tx.update(db.collection('users').doc(d.uid), { balance: firebase.firestore.FieldValue.increment(Number(d.amount) || 0) });
    });
  }catch(e){ alert('Could not reject: ' + e.message); }
}

async function updateStatus(docId, status){
  if(curType === 'withdrawals'){ return status === 'APPROVED' ? openPayout(docId) : rejectWithdrawal(docId); }
  if(!confirm(status + ' this request?')) return;
  try{ await db.collection(curType).doc(docId).update({ status }); }
  catch(e){ alert('Could not update: ' + e.message); }
}
</script></body></html>
