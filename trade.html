<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brixtrade</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root{--bg:#eaf0f5;--pn:#fff;--ink:#12202c;--mut:#5d6f7f;--ln:#d5dee6;--up:#0f8f66;--dn:#cf4338;--brix:#ffae00;--acbg:#fbf1d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px;background:var(--pn);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}
h1{margin:0;margin-right:auto;font-size:18px}
.stat small{display:block;color:var(--mut);font-size:12px}.stat b{font-size:17px}
.btn-brix{background:var(--brix);border:0;padding:7px 14px;border-radius:6px;font-weight:700;cursor:pointer}
main{display:grid;grid-template-columns:240px 1fr 320px;gap:12px;padding:12px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:8px}
#cv{width:100%;height:340px;display:block;background:var(--bg);border-radius:6px}
.buy,.sell{border:0;border-radius:6px;padding:12px;font-weight:800;color:#fff;cursor:pointer;width:100%}.buy{background:var(--up)}.sell{background:var(--dn)}
.bot-card{border:2px solid var(--ln);padding:10px;border-radius:8px;cursor:pointer;margin-top:8px;background:#fff;transition:.2s}.bot-card.active{border-color:var(--brix);background:var(--acbg);transform:scale(1.02)}
.row{display:flex;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--ln);cursor:pointer}.row.on{background:var(--acbg)}.up{color:var(--up)}.dn{color:var(--dn)}
/* BEAUTIFUL POPUP */
#popup{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(4px)}
#popup.show{display:flex}
#popupBox{background:#fff;padding:28px;border-radius:16px;text-align:center;min-width:320px;max-width:90%;animation:pop.3s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 20px 40px rgba(0,0,0,.3)}
#popupBox.win{border-top:6px solid var(--up)}#popupBox.lose{border-top:6px solid var(--dn)}#popupBox.deposit{border-top:6px solid var(--brix)}#popupBox.withdraw{border-top:6px solid #3b82f6}
#popupIcon{font-size:48px;margin-bottom:10px}
#popTitle{margin:8px 0;font-size:22px}#popMsg{color:var(--mut);margin:10px 0 18px;line-height:1.5;white-space:pre-line}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
</style></head><body>
<div id="popup" onclick="closePopup()"><div id="popupBox" onclick="event.stopPropagation()"><div id="popupIcon"></div><h2 id="popTitle"></h2><p id="popMsg"></p><button class="btn-brix" style="width:100%;padding:12px;font-size:15px" onclick="closePopup()">Continue</button></div></div>

<header><h1>BRIX<span style="color:var(--brix)">TRADE</span></h1>
<div class="stat"><small>Balance</small><b id="balance">$10.00</b></div>
<div class="stat"><small>Daily</small><b id="dailyProfit">$0.00</b></div>
<div class="stat"><small>WinRate</small><b id="winRate">0%</b></div>
<button class="btn-brix" onclick="depositWithPaystack()">Deposit</button>
<button class="btn-brix" style="background:#3b82f6;color:#fff" onclick="withdrawNow()">Withdraw</button>
</header>

<main>
<aside class="pn" style="max-height:600px;overflow:auto"><div id="il"></div>
<div style="padding:12px">
<h4>Trading Bots</h4>
<div class="bot-card active" id="bot-scalper" onclick="selectBot('scalper')">⚡ Scalper<br><small>32% Win • Fast</small></div>
<div class="bot-card" id="bot-trend" onclick="selectBot('trend')">📈 Trend<br><small>30% Win • Stable</small></div>
<div class="bot-card" id="bot-sniper" onclick="selectBot('sniper')">🎯 Sniper VIP<br><small>37% Win • High Payout</small></div>
</div>
</aside>
<section class="pn" style="padding:12px">
<h2 id="sn">XAU/USD</h2><b id="sp"></b> <span id="sc"></span> - Timer: <b id="timer">Ready</b>
<canvas id="cv"></canvas>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
<div><input id="stake" style="width:100%;padding:10px" type="number" value="1" min="1"><select id="duration" style="width:100%;margin-top:6px;padding:8px"><option value="30">30s</option><option value="60">60s</option><option value="120">120s VIP</option></select></div>
<div style="display:grid;gap:8px"><button class="buy" onclick="startTrade('BUY')">BUY ▲</button><button class="sell" onclick="startTrade('SELL')">SELL ▼</button></div>
</div>
</section>
<aside class="pn" style="padding:12px"><h4>Activity</h4><div id="msgs"></div></aside>
</main>

<script>
const PAYSTACK_KEY="pk_test_22b6fc1db38418de37247a7c48d3f8b32edfd2e2";
let demoBalance=10, tradeTimer=null, wins=0, trades=0, entryPrice=0, activeBot="scalper";
const $=id=>document.getElementById(id);
const AS=[["EUR","Euro",1.085,"fx"],["GBP","Pound",1.30,"fx"],["XAU","Gold",2650,"mt"],["XAG","Silver",31.5,"mt"]].map(([k,n,p,t])=>({k,n,p0:p,p,t,v:t=="mt"?.0009:.0004,s:[]}));
const M=Object.fromEntries(AS.map(a=>[a.k,a]));
const rn=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(6.2832*Math.random());
function step(a){a.p*=Math.exp(a.v*rn()-.0005*Math.log(a.p/a.p0));const c=a.s[a.s.length-1];c.c=a.p;c.h=Math.max(c.h,a.p);c.l=Math.min(c.l,a.p)}
AS.forEach(a=>{a.s=[{o:a.p,h:a.p,l:a.p,c:a.p}];a.n=0;for(let i=0;i<200;i++){step(a);if(++a.n%5==0)a.s.push({o:a.p,h:a.p,l:a.p,c:a.p})}});
let sel="XAU"; const fp=p=>p.toFixed(p>=100?2:4);
function ui(){ $("il").innerHTML="";AS.forEach(a=>{const r=document.createElement("div");r.className="row"+(a.k==sel?" on":"");r.innerHTML=`${a.k} <span class="${a.p>a.s[0].o?"up":"dn"}">${fp(a.p)}</span>`;r.onclick=()=>{sel=a.k;ui()};$("il").appendChild(r)});$("sn").textContent=sel+"/USD";$("sp").textContent=fp(M[sel].p);draw();}
function draw(){const cv=$("cv"),d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;cv.width=W*d;cv.height=H*d;const g=cv.getContext("2d");g.scale(d,d);const a=M[sel],D=a.s.slice(-60);let lo=Math.min(...D.map(x=>x.l)),hi=Math.max(...D.map(x=>x.h));const Y=v=>H-16-(v-lo)/(hi-lo)*(H-26),bw=W/D.length;D.forEach((x,i)=>{const cx=i*bw,up=x.c>=x.o;g.fillStyle=up?"#0f8f66":"#cf4338";g.fillRect(cx,Math.min(Y(x.o),Y(x.c)),bw*.7,Math.max(1,Math.abs(Y(x.o)-Y(x.c))))});}
setInterval(()=>{AS.forEach(a=>{step(a);if(++a.n%5==0)a.s.push({o:a.p,h:a.p,l:a.p,c:a.p})});ui()},1000);ui();
function updateBalance(){$("balance").textContent="$"+demoBalance.toFixed(2);$("winRate").textContent=trades?Math.round(wins/trades*100)+"%":"0%"}
updateBalance();

// POPUP SYSTEM
function showPopup(type, title, icon, msg){
 const box=$("popupBox"); box.className=type;
 $("popupIcon").textContent=icon; $("popTitle").textContent=title; $("popMsg").textContent=msg;
 $("popup").classList.add("show");
}
function closePopup(){ $("popup").classList.remove("show"); }
function selectBot(k){activeBot=k; document.querySelectorAll(".bot-card").forEach(b=>b.classList.remove("active")); $("bot-"+k).classList.add("active");}

const BOTS={scalper:{name:"Scalper",winIfRight:0.65,payout:0.70},trend:{name:"Trend",winIfRight:0.60,payout:0.75},sniper:{name:"Sniper VIP",winIfRight:0.75,payout:0.80}};

function depositWithPaystack(){
 const usd=prompt("Enter deposit USD (Rate KES 130):","10"); if(!usd) return;
 const usdVal=parseFloat(usd); const kes=Math.round(usdVal*130);
 PaystackPop.setup({key:PAYSTACK_KEY,email:"customer@brixtrade.com",amount:kes*100,currency:"KES",callback:function(r){
   demoBalance+=usdVal; updateBalance();
   showPopup("deposit","💰 Deposit Successful","✅",`Amount: $${usdVal} (KES ${kes})\nReference: ${r.reference}\n\nBalance: $${demoBalance.toFixed(2)}\nReady to trade!`);
 },onClose:function(){ showPopup("lose","Deposit Cancelled","❌","You cancelled the deposit.\nTry again when ready.");}}).openIframe();
}

function withdrawNow(){
 if(demoBalance<5){ showPopup("lose","Withdrawal Failed","⚠️",`Minimum withdrawal is $5\nYour balance: $${demoBalance.toFixed(2)}\nKeep trading!`); return; }
 const amt=prompt(`Withdraw amount (Balance $${demoBalance.toFixed(2)}):`,"5"); if(!amt) return;
 const val=parseFloat(amt); if(val>demoBalance){ showPopup("lose","Insufficient Balance","❌",`You tried to withdraw $${val}\nAvailable: $${demoBalance.toFixed(2)}`); return; }
 demoBalance-=val; updateBalance();
 showPopup("withdraw","🏦 Withdrawal Request Sent","💸",`Amount: $${val.toFixed(2)}\nStatus: Processing (24h)\nMethod: M-Pesa\n\nNew Balance: $${demoBalance.toFixed(2)}`);
}

function startTrade(dir){
 if(tradeTimer){ showPopup("lose","Trade Active","⏳","Wait for current trade to finish"); return}
 const stake=parseFloat($("stake").value)||1;
 if(demoBalance<stake){showPopup("lose","Low Balance","⚠️",`Need $${stake} to trade\nBalance: $${demoBalance.toFixed(2)}\nPlease deposit`);return}
 const duration=parseInt($("duration").value); entryPrice=M[sel].p; let left=duration;
 $("timer").textContent=left+"s";
 tradeTimer=setInterval(()=>{
   left--; $("timer").textContent=left+"s";
   if(left<=0){
     clearInterval(tradeTimer); tradeTimer=null; $("timer").textContent="Ready"; trades++;
     const exitPrice=M[sel].p; const wentUp=exitPrice>entryPrice;
     let guessedRight=(dir==="BUY"&&wentUp)||(dir==="SELL"&&!wentUp);
     let bot=BOTS[activeBot]; let win=guessedRight?Math.random()<bot.winIfRight:false;
     if(win){ wins++; const profit=stake*bot.payout; demoBalance+=profit; updateBalance();
       showPopup("win",`🎉 ${bot.name} WIN!`,"💰",`Direction: ${dir} ${wentUp?"UP 📈":"DOWN 📉"}\nEntry: ${fp(entryPrice)}\nExit: ${fp(exitPrice)}\n\nProfit: +$${profit.toFixed(2)}\nStake: $${stake}\nNew Balance: $${demoBalance.toFixed(2)}`);
     } else { demoBalance-=stake; updateBalance();
       showPopup("lose",`💥 ${bot.name} LOSS`,"📉",`Direction: ${dir} ${wentUp?"UP 📈":"DOWN 📉"}\nEntry: ${fp(entryPrice)}\nExit: ${fp(exitPrice)}\n\nLoss: -$${stake.toFixed(2)}\nPayout if won: $${(stake*bot.payout).toFixed(2)}\nBalance: $${demoBalance.toFixed(2)}\n\nTry again - market moves fast!`);
     }
   }
 },1000);
}
</script></body></html>
