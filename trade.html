<script>const firebaseConfig={apiKey:"AIzaSyA7KMnx_MBfX3DQ5hQ6qzOg6jCbX7kZs-o",authDomain:"brixtrade-c142d.firebaseapp.com",projectId:"brixtrade-c142d",storageBucket:"brixtrade-c142d.firebasestorage.app",messagingSenderId:"489953142453",appId:"1:489953142453:web:2499588c325482d17a00fc"};firebase.initializeApp(firebaseConfig);const db=firebase.firestore();</script>
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Brixtrade</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--bg:#0a0e16;--bg2:#0f1520;--pn:#121927;--pn2:#182131;--ln:#222d40;--ink:#e8edf6;--mut:#8593a8;--up:#34d399;--dn:#f87171;--ac:#8b8dff;--ac2:#6366f1;--acbg:rgba(139,141,255,.1)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter}header{display:flex;gap:12px;align-items:center;padding:14px 22px;background:#0f1520;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}h1{margin:0 auto 0 0;font-family:Sora;font-size:19px}h1 span{color:var(--ac)}.stat b{font-family:JetBrains Mono;font-size:18px}.btn,.btn-brix{padding:9px 16px;border-radius:8px;border:1px solid var(--ln);background:var(--pn2);cursor:pointer;font-weight:700}.btn-brix{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}main{display:grid;grid-template-columns:260px 1fr 320px;gap:16px;padding:16px;max-width:1700px;margin:auto}.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px}#list{max-height:680px;overflow:auto}.tabs{display:flex;padding:6px;gap:4px;border-bottom:1px solid var(--ln)}.tabs button{flex:1;border:0;background:none;padding:8px;color:var(--mut);border-radius:8px;cursor:pointer}.tabs button.on{background:var(--acbg);color:var(--ac)}.row{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #1a2334;cursor:pointer;border-left:3px solid transparent}.row.on{background:var(--acbg);border-left-color:var(--ac)}.up{color:var(--up)}.dn{color:var(--dn)}#ch{padding:18px}#cv{width:100%;height:360px;background:var(--bg2);border:1px solid var(--ln);border-radius:10px;margin-top:12px}#tk{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}#tk label{font-size:11px;color:var(--mut)}input,select{width:100%;padding:11px;border:1px solid var(--ln);background:var(--bg2);border-radius:8px;font-family:JetBrains Mono}.buy,.sell{border:0;border-radius:10px;padding:14px;font-weight:800;cursor:pointer}.buy{background:var(--up)}.sell{background:var(--dn)}.bots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.bot-card{border:1px solid var(--ln);padding:12px;border-radius:10px;cursor:pointer;background:var(--pn2)}.bot-card.active{border-color:var(--ac);background:var(--acbg)}#msgs{display:flex;flex-direction:column;gap:8px;max-height:560px;overflow:auto}#msgs div{padding:9px 11px;background:var(--pn2);border:1px solid var(--ln);border-radius:9px}#popup{position:fixed;inset:0;background:rgba(3,6,12,.72);display:none;align-items:center;justify-content:center;z-index:99}#popup.show{display:flex}#popupBox{background:var(--pn);border:1px solid var(--ln);padding:28px;border-radius:18px;text-align:center;width:360px;max-width:92%}#demoBadge{display:none;background:var(--ac);color:#fff;font-size:10px;padding:2px 7px;border-radius:5px}#demoBadge.on{display:inline-block}#withdrawModal{position:fixed;inset:0;background:rgba(3,6,12,.75);display:none;align-items:center;justify-content:center;z-index:100}.wbox{background:var(--pn);border:1px solid var(--ln);border-radius:18px;padding:24px;max-width:420px;width:92%}</style></head><body>
<div id="popup" onclick="closePopup()"><div id="popupBox" onclick="event.stopPropagation()"><div id="popupIcon"></div><h2 id="popTitle"></h2><p id="popMsg"></p><button class="btn-brix" style="width:100%" onclick="closePopup()">Continue</button></div></div>
<div id="withdrawModal"><div class="wbox"><h2>Withdraw</h2><label>Amount $<span id="wBal">0</span></label><input id="wAmount" type="number"><label>M-Pesa</label><input id="wPhone"><button class="btn-brix" style="width:100%" onclick="submitWithdrawal()">Withdraw</button><button onclick="closeWithdraw()" style="width:100%;margin-top:8px;background:none;border:none;color:var(--mut)">Cancel</button></div></div>

<!-- PRO DEPOSIT MODAL - NO FUNCTIONS NEEDED -->
<div id="mpesaModal" style="position:fixed;inset:0;background:rgba(3,6,12,.85);display:none;align-items:center;justify-content:center;z-index:200;backdrop-filter:blur(6px)">
<div style="background:#121927;border:1px solid #222d40;border-radius:20px;padding:26px;width:440px;max-width:94%">
<div style="display:flex;justify-content:space-between"><h2 style="margin:0;font-family:Sora">Deposit via M-PESA</h2><button onclick="document.getElementById('mpesaModal').style.display='none'" style="background:none;border:none;color:#8593a8;font-size:22px;cursor:pointer">✕</button></div>
<div style="background:#fff;border-radius:10px;padding:10px;text-align:center;margin:14px 0"><b style="color:#0db04b;font-size:22px">M-PESA</b><div style="color:#333;font-size:12px">Secure • $1 = KES 130</div></div>
<label>Amount (USD)</label><input id="mpesaUsd" type="number" value="5" oninput="convertUsdToKes()">
<div style="font-size:12px;color:#22c55e;margin:6px 0">💱 You will pay: <b id="kesPreview">KES 650</b></div>
<label>Phone (for receipt)</label><input id="mpesaPhone" type="tel" placeholder="254712345678">
<div style="background:#182131;border:1px solid #222d40;border-radius:12px;padding:12px;margin:12px 0;font-size:12px">🛡️ 256-bit SSL • Bank-level • Secured by Paystack</div>
<div style="display:flex;justify-content:space-between"><span>Deposit</span><b id="mpesaShowUsd">$5.00</b></div>
<div style="display:flex;justify-content:space-between;font-weight:800"><span>Total to Pay</span><b style="color:#22c55e" id="mpesaTotal">KES 650</b></div>
<button class="btn-brix" id="confirmMpesa" style="width:100%;padding:14px;margin-top:14px;background:#22c55e;color:#000;border:0;border-radius:12px;font-weight:800;font-size:16px" onclick="doProPaystack()">Confirm Deposit</button>
</div></div>

<header><h1>BRIX<span>TRADE</span></h1><div class="stat"><small>Balance <span id="demoBadge">DEMO</span></small><b id="balance">$0.00</b></div><div class="stat"><small>Daily Profit</small><b id="dailyProfit">$0.00</b></div><button class="btn" id="demoBtn" onclick="toggleDemo()">Try Demo</button><button class="btn-brix" onclick="depositWithPaystack()">Deposit</button><button class="btn" onclick="withdraw()">Withdraw</button></header>
<main><aside class="pn" id="list"><div class="tabs" id="ft"><button class="on" data-f="all">All</button><button data-f="fx">FX</button><button data-f="mt">Metals</button></div><div id="il"></div></aside>
<section class="pn" id="ch"><div class="ttl"><h2 id="sn">-</h2><b id="sp">-</b><span id="sc"></span><span id="sq">Timer: <b id="timer">Ready</b></span></div><canvas id="cv"></canvas>
<div id="tk"><div><label>Stake($)</label><input id="stake" type="number" value="1"></div><div><label>Duration</label><select id="duration"><option value="30">30s</option><option value="60">60s</option><option value="120">120s VIP</option></select></div><button class="buy" onclick="startTrade('BUY')">BUY ▲</button><button class="sell" onclick="startTrade('SELL')">SELL ▼</button></div>
<div class="bots"><div class="bot-card active" onclick="selectBot('scalper',this)"><h3>⚡ Scalper</h3></div><div class="bot-card" onclick="selectBot('trend',this)"><h3>📈 Trend</h3></div><div class="bot-card" onclick="selectBot('sniper',this)"><h3>🎯 Sniper VIP</h3></div></div></section>
<aside class="pn" style="padding:16px"><h3>Trade Assistant</h3><div id="msgs"></div></aside></main>
<script>
const PAYSTACK_KEY="pk_live_0beac5527720989e538120555ad8f42646691193";
let demoBalance=0,isDemo=false,demoBalanceFake=1000,tradeTimer=null,entryPrice=0,dailyProfitAmount=0,demoDailyProfit=0,lastProfitReset=new Date().toDateString();
const USD_TO_KES=130,PAYOUT=0.7,$=id=>document.getElementById(id);
const AS=[["EUR",1.085,"fx"],["GBP",1.30,"fx"],["JPY",.0067,"fx"],["XAU",2650,"mt"],["XAG",31.5,"mt"]].map(([k,p,t])=>({k,p0:p,p,t,v:.0004,s:[]}));
const M=Object.fromEntries(AS.map(a=>[a.k,a])),rn=()=>Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(6.2832*Math.random());
function step(a){a.p*=Math.exp(a.v*rn()-.0005*Math.log(a.p/a.p0));const c=a.s[a.s.length-1];if(c){c.c=a.p;c.h=Math.max(c.h,a.p);c.l=Math.min(c.l,a.p)}}
AS.forEach(a=>{a.s=[{o:a.p,h:a.p,l:a.p,c:a.p}];a.n=0;for(let i=0;i<400;i++){step(a);if(++a.n%5==0)a.s.push({o:a.p,h:a.p,l:a.p,c:a.p})}});
let sel="XAU",flt="all";const fp=p=>p.toFixed(p>=100?2:4);
function ui_design(){$("il").innerHTML="";AS.filter(a=>flt=="all"||a.t==flt).forEach(a=>{const ch=(a.p/a.s[0].o-1)*100,r=document.createElement("div");r.className="row"+(a.k==sel?" on":"");r.innerHTML=`<span><b>${a.k}/USD</b></span><span>${fp(a.p)}<small class="${ch>=0?"up":"dn"}">${ch.toFixed(2)}%</small></span>`;r.onclick=()=>{sel=a.k;ui_design()};$("il").appendChild(r)});const a=M[sel],ch=(a.p/a.s[0].o-1)*100;$("sn").textContent=a.k+"/USD";$("sp").textContent=fp(a.p);$("sc").textContent=ch.toFixed(2)+"%";draw()}
function draw(){const cv=$("cv"),d=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(!W)return;cv.width=W*d;cv.height=H*d;const g=cv.getContext("2d");g.scale(d,d);const a=M[sel],D=a.s.slice(-70);let lo=Math.min(...D.map(x=>x.l)),hi=Math.max(...D.map(x=>x.h));const pd=(hi-lo)*.08||hi*.001;lo-=pd;hi+=pd;const Y=v=>H-16-(v-lo)/(hi-lo)*(H-26),bw=W/D.length;D.forEach((x,i)=>{const cx=i*bw;g.fillStyle=x.c>=x.o?"#34d399":"#f87171";g.fillRect(cx,bw*.3,Math.max(1,Y(x.l)-Y(x.h)));});}
$("ft").onclick=e=>{if(!e.target.dataset.f)return;flt=e.target.dataset.f;[...$("ft").children].forEach(b=>b.classList.toggle("on",b==e.target));ui_design()};setInterval(()=>{AS.forEach(a=>{step(a);if(++a.n%5==0)a.s.push({o:a.p,h:a.p,l:a.p,c:a.p})});ui_design()},1000);ui_design();
function say(t){const m=document.createElement("div");m.textContent=t;$("msgs").prepend(m)}
function showPopup(type,title,icon,msg){$("popupBox").className=type;$("popupIcon").textContent=icon;$("popTitle").textContent=title;$("popMsg").textContent=msg;$("popup").classList.add("show")}
function closePopup(){$("popup").classList.remove("show")}
function getCurrentBalance(){return isDemo?demoBalanceFake:demoBalance}
function setCurrentBalance(v){if(isDemo)demoBalanceFake=v;else demoBalance=v; saveBalanceToFirebase();}
function updateBalance(){$("balance").textContent="$"+getCurrentBalance().toFixed(2);$("demoBadge").classList.toggle("on",isDemo);$("demoBtn").textContent=isDemo?"Leave Demo":"Try Demo"}
function setPnl(v){$("dailyProfit").textContent=(v>=0?"+":"-")+"$"+Math.abs(v).toFixed(2)}
updateBalance();
function toggleDemo(){if(tradeTimer){showPopup("lose","Trade Active","⏳","Wait");return}isDemo=!isDemo;if(isDemo){demoBalanceFake=1000;demoDailyProfit=0;setPnl(0);updateBalance();say("DEMO $1000")}else{setPnl(dailyProfitAmount);updateBalance();say("REAL mode")}}
function withdraw(){const bal=getCurrentBalance();if(isDemo){showPopup("lose","Demo","🎮","No withdraw demo");return}if(bal<5){showPopup("lose","Fail","⚠️",`Min $5 Balance $${bal}`);return}$("wBal").textContent=bal.toFixed(2);$("withdrawModal").style.display="flex"}
function closeWithdraw(){$("withdrawModal").style.display="none"}
async function submitWithdrawal(){const amt=parseFloat($("wAmount").value);if(!amt||amt<5){alert("Min $5");return}setCurrentBalance(getCurrentBalance()-amt);updateBalance();try{await db.collection("withdrawals").doc(String(Date.now())).set({amount:amt,phone:$("wPhone").value,date:new Date().toLocaleString()});}catch(e){}closeWithdraw();showPopup("withdraw","Withdraw","💸",`$${amt} Pending`)}
function selectBot(b,el){document.querySelectorAll(".bot-card").forEach(c=>c.classList.remove("active"));el.classList.add("active");$("duration").value=b==="scalper"?30:b==="trend"?60:120}
function getForcedTradeHistory(){try{return JSON.parse(localStorage.getItem('brixForced10')||'[]')}catch(e){return[]}}function saveForcedTradeHistory(h){localStorage.setItem('brixForced10',JSON.stringify(h))}
function startTrade(dir){if(tradeTimer){showPopup("lose","Active","⏳","Wait");return}const stake=parseFloat($("stake").value)||1;if(getCurrentBalance()<stake){if(isDemo){demoBalanceFake=1000;updateBalance()}else{showPopup("lose","Low","⚠️",`Need $${stake}`);return}}if(!isDemo&&dailyProfitAmount>=15){showPopup("lose","Daily Limit","⏰","$15/day max");return}const duration=parseInt($("duration").value);entryPrice=M[sel].p;let left=duration;$("timer").textContent=left+"s";say(dir+" $"+stake+" "+sel);tradeTimer=setInterval(()=>{left--;$("timer").textContent=left+"s";if(left>0)return;clearInterval(tradeTimer);tradeTimer=null;$("timer").textContent="Ready";const exitPrice=M[sel].p;const wentUp=exitPrice>entryPrice,guessedRight=(dir==="BUY"&&wentUp)||(dir==="SELL"&&!wentUp);let win;if(isDemo){win=guessedRight}else{let h=getForcedTradeHistory();if(h.length>=10)h=[];let w=h.filter(v=>v===1).length;if(w>=4)win=false;else{let r=10-h.length,n=4-w;if(r<=n)win=true;else win=guessedRight?Math.random()<0.8:false}h.push(win?1:0);saveForcedTradeHistory(h)}if(win){const p=stake*PAYOUT;setCurrentBalance(getCurrentBalance()+p);if(!isDemo)dailyProfitAmount+=p;else demoDailyProfit+=p;setPnl(isDemo?demoDailyProfit:dailyProfitAmount);updateBalance();showPopup("win",`🎉 ${dir} WIN`,"💰",`+ $${p.toFixed(2)} Balance $${getCurrentBalance().toFixed(2)}`)}else{setCurrentBalance(getCurrentBalance()-stake);if(!isDemo)dailyProfitAmount-=stake;else demoDailyProfit-=stake;setPnl(isDemo?demoDailyProfit:dailyProfitAmount);updateBalance();showPopup("lose",`💥 ${dir} LOSS`,"📉",`- $${stake} Balance $${getCurrentBalance().toFixed(2)}`)}},1000)}

// FIREBASE PERSISTENCE + USD->KES
let currentUid=localStorage.getItem("brix_uid")||("user_"+Date.now());localStorage.setItem("brix_uid",currentUid);
db.collection("users").doc(currentUid).onSnapshot(d=>{if(d.exists&&!isDemo){demoBalance=d.data().balance||0;dailyProfitAmount=d.data().dailyProfit||0;updateBalance();setPnl(dailyProfitAmount)}});
function saveBalanceToFirebase(){if(isDemo)return;db.collection("users").doc(currentUid).set({balance:demoBalance,dailyProfit:dailyProfitAmount,lastUpdate:new Date()},{merge:true});}
function convertUsdToKes(){const usd=parseFloat($("mpesaUsd").value)||0;const kes=usd*USD_TO_KES;$("kesPreview").textContent="KES "+kes.toLocaleString();$("mpesaShowUsd").textContent="$"+usd.toFixed(2);$("mpesaTotal").textContent="KES "+kes.toLocaleString();}
function depositWithPaystack(){if(isDemo){showPopup("lose","Demo","🎮","Leave Demo");return}document.getElementById('mpesaModal').style.display='flex';convertUsdToKes();}
function doProPaystack(){
  const usd=parseFloat($("mpesaUsd").value)||0; const kes=usd*USD_TO_KES;
  if(!usd||usd<1){alert("Min $1");return}
  const phone=$("mpesaPhone").value.trim();
  document.getElementById('mpesaModal').style.display='none';
  const handler=PaystackPop.setup({
    key:PAYSTACK_KEY,email:"customer@brixtrade.com",amount:kes*100,currency:"KES",
    metadata:{custom_fields:[{display_name:"Phone",variable_name:"phone",value:phone},{display_name:"USD Amount",variable_name:"usd_amount",value:usd}]},
    callback:function(res){
      isDemo=false; demoBalance+=usd; updateBalance(); saveBalanceToFirebase();
      db.collection("deposits").doc(res.reference).set({uid:currentUid,usd, kes, phone, reference:res.reference, status:"success", createdAt:new Date()});
      say(`Deposit SUCCESS $${usd}=KES ${kes} Ref ${res.reference}`); showPopup("deposit","Deposit Successful","✅",`Amount: $${usd} (KES ${kes})\nRef: ${res.reference}\nBalance: $${demoBalance.toFixed(2)}`);
    },
    onClose:function(){say("Deposit closed"); showPopup("lose","Cancelled","❌","You closed Paystack");}
  }); handler.openIframe();
}
</script></body></html>
