<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>BrixTrade Admin – Send Notification</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}body{background:#0a0a0f;color:#fff;min-height:100vh}
#lockScreen{position:fixed;inset:0;background:#0a0a0f;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.lockBox{background:#16161f;border:1px solid #26263a;border-radius:16px;padding:28px;width:100%;max-width:360px;text-align:center}
.lockBox h2{margin-bottom:8px}.lockBox p{color:#8a8ab3;font-size:13px;margin-bottom:18px}
.lockBox input{width:100%;padding:14px;border-radius:10px;border:1px solid #333355;background:#0e0e18;color:#fff;font-size:15px;outline:none;margin-bottom:12px}
.lockBox button{width:100%;padding:14px;border-radius:10px;border:none;background:#8b8dff;color:#fff;font-weight:800;font-size:14px;cursor:pointer}
.lockBox .err{color:#ff5a5a;font-size:12px;margin-top:10px;display:none}
.header{background:#12121b;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #22223a;flex-wrap:wrap;gap:10px}
.btn{padding:8px 12px;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px;background:#2a2a44;color:#fff;text-decoration:none;display:inline-block}
#appContent{display:none}
.wrap{max-width:560px;margin:0 auto;padding:20px}
.box{background:#16161f;border:1px solid #26263a;border-radius:14px;padding:20px}
.box h2{font-size:18px;margin-bottom:4px}.sub{color:#8a8ab3;font-size:12px;margin-bottom:14px}
label{display:flex;justify-content:space-between;font-size:12px;color:#8a8ab3;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333355;background:#0e0e18;color:#fff;font-size:15px;outline:none}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:#8b8dff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.chip{border:1px solid #2a2a44;background:#1a1a2a;color:#9a9ab8;padding:6px 11px;border-radius:99px;cursor:pointer;font-weight:700;font-size:12px}
.chip:hover{border-color:#8b8dff;color:#fff}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:11px;border-radius:10px;border:1px solid #333355;background:#0e0e18;color:#9a9ab8;font-weight:700;cursor:pointer}
.seg button.on{background:#8b8dff;color:#fff;border-color:#8b8dff}
.prev{margin-top:16px;border:1px solid #26263a;border-radius:12px;padding:12px;background:#0e0e18;display:flex;gap:10px;align-items:flex-start}
.prev .ic{width:36px;height:36px;border-radius:9px;background:#8b8dff;display:grid;place-items:center;font-weight:800;flex:none}
.prev b{display:block;font-size:14px}.prev span{color:#b8b8d0;font-size:13px;word-break:break-word}
.send{width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:#00d084;color:#000;font-weight:800;font-size:15px;cursor:pointer}
.send:disabled{opacity:.5;cursor:wait}
#res{margin-top:12px;font-size:13px;min-height:18px}.ok{color:#00d084}.bad{color:#ff5a5a}
</style></head><body>

<div id="lockScreen"><div class="lockBox">
  <h2>🔒 BrixTrade Admin</h2><p>Sign in with your admin account</p>
  <input id="emailInput" type="email" placeholder="Admin email" autocomplete="username">
  <input id="passInput" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')adminLogin()">
  <button onclick="adminLogin()">Sign in</button>
  <div class="err" id="errMsg"></div>
</div></div>

<div id="appContent">
  <div class="header"><div><b>BrixTrade LIVE</b> <span style="color:#666;font-size:12px">/ Send notification</span></div><div><a class="btn" href="admin.html">← Back to admin</a> <button class="btn" onclick="logoutAdmin()">Logout</button></div></div>
  <div class="wrap"><div class="box">
    <h2>Send a notification</h2>
    <p class="sub">Goes to phones and browsers where the user turned on Alerts, even when the app is closed.</p>

    <label>Quick start</label>
    <div class="chips" id="tpls"></div>

    <label for="nTitle"><span>Title</span><span id="cTitle">0/80</span></label>
    <input id="nTitle" maxlength="80" placeholder="e.g. Deposit received" oninput="upd()">

    <label for="nBody"><span>Message</span><span id="cBody">0/300</span></label>
    <textarea id="nBody" maxlength="300" placeholder="Write your message..." oninput="upd()"></textarea>

    <label for="nUrl">When tapped, open</label>
    <select id="nUrl"><option value="/trade.html">Trading page</option><option value="/profile.html">Wallet</option></select>

    <label>Send to</label>
    <div class="seg"><button id="segAll" class="on" onclick="setTo('all')">Everyone</button><button id="segOne" onclick="setTo('one')">One user</button></div>
    <input id="nUid" placeholder="User ID (the long code, e.g. from the Verification tab)" style="display:none;margin-top:10px" autocomplete="off">

    <div class="prev"><div class="ic">B</div><div><b id="pvT">Title</b><span id="pvB">Your message appears here</span></div></div>

    <button class="send" id="sendBtn" onclick="sendNow()">Send notification</button>
    <div id="res"></div>
  </div></div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyA7KMnx_MBfX3DQ5hQ6qzOg6jCbX7kZs-o", authDomain: "brixtrade-c142d.firebaseapp.com", projectId: "brixtrade-c142d", storageBucket: "brixtrade-c142d.firebasestorage.app", messagingSenderId: "489953142453", appId: "1:489953142453:web:2499588c325482d17a00fc", measurementId: "G-EX79EB9RDN" };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const $ = id => document.getElementById(id);
let to = 'all';

function showErr(m){ const e = $('errMsg'); e.textContent = m; e.style.display = 'block'; }
function adminLogin(){
  const email = $('emailInput').value.trim(), pass = $('passInput').value;
  if(!email || !pass){ showErr('Enter your email and password'); return; }
  $('errMsg').style.display = 'none';
  auth.signInWithEmailAndPassword(email, pass).catch(e => showErr(e.message));
}
function logoutAdmin(){ auth.signOut().then(() => location.reload()); }

auth.onAuthStateChanged(async user => {
  if(!user) return;
  try{
    const snap = await db.collection('admins').doc(user.uid).get();
    if(!snap.exists){ showErr('This account is not an admin.'); await auth.signOut(); return; }
    $('lockScreen').style.display = 'none';
    $('appContent').style.display = 'block';
  }catch(e){ showErr('Could not verify admin access: ' + e.message); }
});

const TPLS = [
  ['Deposit received', 'Deposit received', 'Your deposit has been added to your balance.', '/profile.html'],
  ['Withdrawal sent', 'Withdrawal sent', 'Your withdrawal has been sent to your M-PESA.', '/profile.html'],
  ['Verified', 'Identity verified', 'Your identity is verified. You can now withdraw.', '/profile.html'],
  ['Trade now', 'Markets are moving', 'Good trading conditions right now. Open Brixtrade to trade.', '/trade.html']
];
$('tpls').innerHTML = TPLS.map((t, i) => '<button class="chip" onclick="useTpl(' + i + ')">' + t[0] + '</button>').join('');
function useTpl(i){ const t = TPLS[i]; $('nTitle').value = t[1]; $('nBody').value = t[2]; $('nUrl').value = t[3]; upd(); }

function upd(){
  const t = $('nTitle').value, b = $('nBody').value;
  $('cTitle').textContent = t.length + '/80'; $('cBody').textContent = b.length + '/300';
  $('pvT').textContent = t || 'Title'; $('pvB').textContent = b || 'Your message appears here';
}
function setTo(v){
  to = v;
  $('segAll').classList.toggle('on', v === 'all'); $('segOne').classList.toggle('on', v === 'one');
  $('nUid').style.display = v === 'one' ? 'block' : 'none';
}

async function sendNow(){
  const title = $('nTitle').value.trim(), body = $('nBody').value.trim(), url = $('nUrl').value;
  const uid = $('nUid').value.trim(), res = $('res');
  res.className = ''; res.textContent = '';
  if(!title || !body){ res.className = 'bad'; res.textContent = 'Write a title and a message first.'; return; }
  if(to === 'one' && uid.length < 10){ res.className = 'bad'; res.textContent = 'Enter the full user ID.'; return; }
  if(!confirm(to === 'all' ? 'Send this to EVERYONE who turned on alerts?' : 'Send this to that one user?')) return;
  const btn = $('sendBtn'); btn.disabled = true; btn.textContent = 'Sending...';
  try{
    const token = await auth.currentUser.getIdToken();
   const r = await fetch('https://bixtrade-peach.vercel.app//api/send-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ title, body, url, uid: to === 'one' ? uid : undefined })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'Failed');
    if(!d.devices){ res.className = 'bad'; res.textContent = to === 'one' ? 'That user has not turned on alerts on any device.' : 'No one has turned on alerts yet.'; }
    else { res.className = 'ok'; res.textContent = 'Sent to ' + d.sent + ' of ' + d.devices + ' device(s).'; }
  }catch(e){ res.className = 'bad'; res.textContent = 'Could not send: ' + e.message; }
  btn.disabled = false; btn.textContent = 'Send notification';
}
</script></body></html>
